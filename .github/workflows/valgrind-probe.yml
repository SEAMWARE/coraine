#
# A throwaway experiment, dispatch-only: WHY does a broker under valgrind take two
# minutes to exit in CI, when it takes under a second on a workstation?
#
# Every valgrind shard reported ~128s per test regardless of which test it ran -
# 8s of work and 120s of waiting, 120s being exactly the harness's cap on how long
# it waits for a graceful exit. This times the phases separately, with and without
# mongo, so the cost lands on something specific instead of on "valgrind is slow".
#
name: Valgrind probe

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-24-814ad08
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
    env:
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di

      - name: Time each phase, per backend and per option set
        working-directory: stack/coraine
        run: |
          probe() {
            local label="$1" dbArgs="$2" origins="$3" pool="$4"
            local vg="valgrind --leak-check=full --show-leak-kinds=definite,indirect \
                      --errors-for-leak-kinds=none --track-origins=$origins --num-callers=40 \
                      --child-silent-after-fork=yes --log-file=/tmp/probe.vg"

            echo "=============== $label (origins=$origins, pool=$pool)"
            # No `bc` in the image - and the first run of this probe spent its whole
            # life reporting "0.0s" because of it. Nanoseconds and integer arithmetic.
            local t0=$(date +%s%N)
            $vg coraine --port 1029 $dbArgs --troe none --connectionPoolSize "$pool" \
                > /tmp/probe.log 2>&1 &
            local pid=$!

            until (exec 3<>/dev/tcp/127.0.0.1/1029) 2>/dev/null; do
              kill -0 $pid 2>/dev/null || { echo "  broker died during startup"; cat /tmp/probe.log; return 1; }
              sleep 0.2
            done
            local t1=$(date +%s%N)
            printf "  startup: %d ms\n" $(( (t1 - t0) / 1000000 ))

            curl -sf "http://localhost:1029/ngsi-ld/v1/types" > /dev/null && echo "  answers requests"

            kill -TERM $pid
            local n=0
            while kill -0 $pid 2>/dev/null && [ $n -lt 1800 ]; do sleep 0.1; n=$((n + 1)); done
            local t2=$(date +%s%N)
            printf "  shutdown after SIGTERM: %d ms%s\n" $(( (t2 - t1) / 1000000 )) \
                   "$([ $n -ge 1800 ] && echo '  (STILL RUNNING - gave up)')"
            kill -9 $pid 2>/dev/null || true
            echo "  valgrind said:"; tail -4 /tmp/probe.vg 2>/dev/null | sed 's/^/    /'
          }

          probe "corDB"  "--database corDB"                    yes 32
          probe "corDB"  "--database corDB"                    no  32
          probe "mongoc" "--database mongoc --dbHost mongo"    yes 32
          probe "mongoc" "--database mongoc --dbHost mongo"    no  32
          probe "corDB, small pool" "--database corDB"         yes 4
