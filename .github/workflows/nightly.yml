#
# The slow half of the testing: the ETSI conformance suite, the whole functional
# suite under valgrind, and coverage. None of it belongs on a pull request - it
# would turn a two-minute check into an hour - and none of it is worth running on
# a day when nothing merged, which is what the `gate` job decides.
#
# Standard runners are free for public repositories, so the constraint here is not
# cost but the 6-hour per-job ceiling. That is why valgrind is sharded.
#
name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if nothing merged in the last 24 hours'
        type: boolean
        default: false
      only:
        description: 'Run just one of the four - for trying a fix without paying for the other three'
        type: choice
        default: all
        options: [all, coverage, valgrind, etsi, performance]

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      only: ${{ inputs.only || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "main moved in the last 24h - running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing merged since yesterday - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  #
  # Coverage: both DBs, because they are two different measurements. The report
  # lands as an artifact and the numbers in the run summary, so a trend is visible
  # without downloading anything.
  #
  coverage:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all", "coverage"]'), needs.gate.outputs.only)
    runs-on: ubuntu-latest
    # pinned - see the note in ci.yml
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
      timescale:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
      context-server:
        image: wistefan/context-server:0.2.0
        env:
          MEMORY_ENABLED: 'true'
        ports: ['7080:8080']
    env:
      COR_MONGO_HOST: mongo
      COR_TROE_HOST: timescale
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      KJSON: ${{ github.workspace }}/stack/kjson/bin/kjson
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      - name: Forward localhost:7080 to the @context server
        run: socat TCP-LISTEN:7080,fork,reuseaddr TCP:context-server:8080 &

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh
      #
      # This job measures an INSTRUMENTED tree that it never installs - the plugins
      # are staged into BUILD_COVERAGE and found through COR_PLUGIN_DIR. Two tests
      # need the DEFAULT location populated anyway, and both failed here, in both DB
      # runs, from the day the job was written: `usage.test` clears
      # SEAMWARE_PLUGIN_DIR on purpose - it pins the default plugin directory, which
      # was empty, so the broker printed "plugin 'corDB': not found" and the generic
      # option help instead of the list it was asserting - and
      # csource-reg-proactive-loop lost its whole contextSourceExtras block, which
      # comes from a file only `install` puts in /opt/seamware/etc.
      #
      # Nobody saw it: the coverage target ends the suite with `|| true`, so that a
      # red test still yields a report. So the same two tests went red every night,
      # in silence, in a job whose numbers are the point.
      #
      # The valgrind job below has always done this. The measurement is unaffected -
      # COR_BROKER still names the instrumented binary, and the only thing resolved
      # out of /opt/seamware is the plugin set that usage.test deliberately looks
      # for there.
      #
      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di
      #
      # gcovr --print-summary already prints lines/functions/branches; the makefile
      # has been doing it all along and this job used to throw it away and write
      # "report generated" instead. Tee it, so the numbers reach both the log and
      # the run summary - which is what the comment above this job always claimed.
      #
      - name: Coverage - mongoc
        working-directory: stack/coraine
        run: |
          make coverage DB=mongoc GCOVR=gcovr CORTEST=../corLibs/bin/corTest 2>&1 | tee /tmp/cov-mongoc.txt
      - name: Coverage - corDB
        working-directory: stack/coraine
        run: |
          make coverage GCOVR=gcovr CORTEST=../corLibs/bin/corTest 2>&1 | tee /tmp/cov-corDB.txt
      - name: Summarise
        if: always()
        working-directory: stack/coraine
        run: |
          {
            echo "### Coverage"
            for db in mongoc corDB; do
              [ -f "coverage-$db/index.html" ] || continue
              echo "<details><summary><b>$db</b></summary>"
              echo
              echo '```'
              # The three summary lines gcovr prints last; verbatim, not parsed -
              # a regex over someone else's output format is a future silent zero.
              grep -aE '^(lines|functions|branches):' "/tmp/cov-$db.txt" || echo "(no summary captured)"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      #
      # The publishable tree. Built here because this is where the reports are;
      # the deploy happens in a separate job that is NOT in a container (the Pages
      # actions want the runner's own toolchain).
      #
      - name: Assemble the coverage site
        if: always()
        working-directory: stack/coraine
        run: |
          mkdir -p site
          for db in mongoc corDB; do
            [ -d "coverage-$db" ] && cp -r "coverage-$db" "site/$db"
          done
          {
            echo '<!doctype html><meta charset="utf-8"><title>coraine coverage</title>'
            echo '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem}'
            echo 'pre{background:#f4f4f5;padding:1rem;overflow-x:auto}a{color:#0969da}</style>'
            echo '<h1>coraine — test coverage</h1>'
            echo "<p>Generated from <code>main</code> at <code>${GITHUB_SHA:0:7}</code> on $(date -u '+%Y-%m-%d %H:%M UTC').</p>"
            echo '<p>Coverage is measured <b>per database plugin</b> — they are two different'
            echo 'measurements, not two runs of one.</p>'
            for db in mongoc corDB; do
              [ -d "site/$db" ] || continue
              echo "<h2><a href=\"$db/index.html\">$db</a></h2><pre>"
              grep -aE '^(lines|functions|branches):' "/tmp/cov-$db.txt" || echo "(no summary captured)"
              echo '</pre>'
            done
          } > site/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-site
          path: stack/coraine/site
          retention-days: 14

  #
  # Publish the coverage report to GitHub Pages.
  #
  # ONLY from main. A branch dispatch (`gh workflow run nightly.yml --ref <branch>`)
  # is how a fix gets tried before it is merged, and those numbers must never
  # overwrite the ones that describe main - a coverage page that silently shows a
  # feature branch is worse than no page.
  #
  # This is effectively "on merge to main" without paying for it: the gate above
  # only lets the scheduled run proceed when main moved in the last 24 hours, so a
  # publish happens after merges and not otherwise. Coverage takes ~47 minutes; a
  # job per merge would spend that on every one.
  #
  # Not in a container, unlike the coverage job - the Pages actions want the
  # runner's own toolchain.
  #
  publish-coverage:
    needs: [gate, coverage]
    if: needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Say where it went
        run: echo "Coverage published to ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  #
  # Valgrind: the same suite, with the broker under valgrind, failing on definite
  # or indirect leaks. Measured elsewhere at roughly 7 s per test under valgrind,
  # so 613 tests is about 1.2 hours - comfortably inside the 6-hour ceiling even
  # unsplit. It is split into FOUR anyway: four is the shape the sibling project
  # uses for its functional runs, a shard finishes in ~20 minutes, and a leak in
  # shard 3 does not make you wait for shards 1, 2 and 4 to finish first.
  #
  valgrind:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all", "valgrind"]'), needs.gate.outputs.only)
    runs-on: ubuntu-latest
    #
    # The job's NAME carries its range, so a red square in the checks list says which
    # part of the suite went red without opening it - Orion-LD's convention
    # (functional_0_501, functional_502_876, ...), in this repo's punctuation.
    #
    # The boundaries are BALANCED BY TIME, not by count, and measured rather than
    # guessed: run 32485620075 timed all 612 cases, and equal counts of 153 came out
    # at 17.3 / 16.4 / 16.3 / 20.0 minutes. The stage finishes when its slowest shard
    # does, so those uneven ends cost two and a half minutes of wall clock for
    # nothing. These four are within ten seconds of each other.
    #
    # The last shard has NO upper bound (corTest treats --toIx 0 as "to the end"), and
    # that is not tidiness: hardcode 612 there and test 613 is never run by anybody,
    # silently, the day somebody adds it. Re-measure and re-cut when the suite has
    # grown enough for shard 4 to drift - it is the one that absorbs every new test.
    #
    name: valgrind ${{ matrix.shard.name }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: '1-156',   from: 1,   to: 156 }
          - { name: '157-319', from: 157, to: 319 }
          - { name: '320-476', from: 320, to: 476 }
          - { name: '477-end', from: 477, to: 0 }
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
      timescale:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
      context-server:
        image: wistefan/context-server:0.2.0
        env:
          MEMORY_ENABLED: 'true'
        ports: ['7080:8080']
    env:
      # --track-origins doubles the runtime, and CI only needs to know THAT a
      # value is uninitialised. Where it came from is a question for a local run.
      COR_VALGRIND_ORIGINS: 'no'
      COR_MONGO_HOST: mongo
      COR_TROE_HOST: timescale
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      KJSON: ${{ github.workspace }}/stack/kjson/bin/kjson
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      - name: Forward localhost:7080 to the @context server
        run: socat TCP-LISTEN:7080,fork,reuseaddr TCP:context-server:8080 &

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh
      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di
      - name: Suite under valgrind - tests ${{ matrix.shard.name }}
        working-directory: stack/coraine
        run: |
          # An empty --toIx is corTest's "to the end" (toIx=0), which is what the
          # last shard wants and every other shard must not have.
          to=""
          [ "${{ matrix.shard.to }}" != "0" ] && to="--toIx ${{ matrix.shard.to }}"
          ../corLibs/bin/corTest -db mongoc --noColor -vt --fromIx ${{ matrix.shard.from }} $to
      #
      # The .out alone is not enough for a valgrind failure: it is the output of a
      # test that PASSED functionally, and says nothing about the memory. The
      # per-test .vg is the evidence, and the broker log says why the report ends
      # where it does - a run that scored "report INCOMPLETE" left neither behind,
      # on a runner that is gone by the time anybody reads the red square.
      #
      # corTest keeps a failing test's .vg in /tmp and deletes a passing one's, so
      # whatever is left here belongs to the tests that went red. Collected into
      # the workspace rather than uploaded from /tmp: an absolute path would make
      # the artifact's root the filesystem root.
      - name: Collect the valgrind evidence
        if: failure()
        run: cp /tmp/corValgrind.*.vg stack/coraine/test/funcTests/cases/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: valgrind-${{ matrix.shard.name }}
          path: |
            stack/coraine/test/funcTests/cases/*.out
            stack/coraine/test/funcTests/cases/*.log
            stack/coraine/test/funcTests/cases/*.vg
          retention-days: 7

  #
  # The ETSI conformance suite, against OUR corrected branch of it. The fixes are
  # test-side - the published suite has bugs of its own and parts of it do not run
  # - and they are filed upstream; until they land, this branch is what a coraine
  # conformance claim is measured against.
  #
  etsi:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all", "etsi"]'), needs.gate.outputs.only)
    runs-on: ubuntu-latest
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
      timescale:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
      context-server:
        image: wistefan/context-server:0.2.0
        env:
          MEMORY_ENABLED: 'true'
        ports: ['7080:8080']
    env:
      COR_MONGO_HOST: mongo
      COR_TROE_HOST: timescale
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      KJSON: ${{ github.workspace }}/stack/kjson/bin/kjson
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      - name: Forward localhost:7080 to the @context server
        run: socat TCP-LISTEN:7080,fork,reuseaddr TCP:context-server:8080 &

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh
      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di

      - name: Clone the corrected ETSI suite
        run: |
          git clone --depth 1 --branch integration/all-fixes \
            https://forge.etsi.org/rep/cim/ngsi-ld-test-suite.git etsi-suite
          cd etsi-suite && git log --oneline -1

      - name: Python environment for Robot Framework
        working-directory: etsi-suite
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Start the broker
        run: |
          #
          # --troeSync: the suite writes through the Core API and reads the
          # temporal representation on the next line, with no pause - TP 021_23
          # does exactly that. The broker's DEFAULT defers the temporal write
          # until after the response, which is a deliberate design choice (a
          # temporal write is history, not state the caller waits on) but is not
          # what a conformance run wants. Conformance is measured with the broker
          # in read-your-writes mode rather than with sleeps sprinkled through
          # somebody else's test suite.
          #
          coraine --port 1026 --database mongoc --dbHost mongo --dbName etsi \
                  --troe timescale --troeHost timescale --troeName etsi_troe \
                  --troeSync \
                  --distributed --apiPlugins admin > /tmp/etsi-broker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:1026/ngsi-ld/v1/types >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:1026/admin/version

      #
      # ETSI_QUIET_IO: the suite echoes every request and response to the terminal
      # - about 4400 pairs, 175,000 lines - which buries the one line per test that
      # says what happened. Everything is still in log.html and output.xml, which
      # is where a failure gets read anyway.
      #
      - name: Run the TP suite
        working-directory: etsi-suite
        env:
          ETSI_QUIET_IO: '1'
        run: |
          .venv/bin/robot --outputdir /tmp/etsi-out \
            --variable url:"http://localhost:1026/ngsi-ld/v1" \
            --variable temporal_api_url:"http://localhost:1026/ngsi-ld/v1" \
            --variable notification_server_port:8085 \
            --variable context_server_port:8087 \
            TP/NGSI-LD/

      - name: Summarise
        if: always()
        working-directory: etsi-suite
        run: |
          python3 "$GITHUB_WORKSPACE/stack/coraine/test/etsi/etsiSummary.py" /tmp/etsi-out/output.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Broker log and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etsi-results
          path: |
            /tmp/etsi-out
            /tmp/etsi-broker.log
          retention-days: 14

  #
  # Performance. RELEASE build - a debug broker measures the debug broker - and
  # the numbers are kept, because a number with nothing to compare against says
  # nothing. History lives on the perf-history branch: one JSON line per run,
  # durable, greppable, and `git log` is the trend.
  #
  # The comparison is against the MEDIAN of the last few runs rather than against
  # yesterday, and the thresholds are wide: a shared runner moves 20-30% on its
  # own, and a perf gate that cries wolf is a perf gate nobody reads.
  #
  performance:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all", "performance"]'), needs.gate.outputs.only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
    env:
      COR_MONGO_HOST: mongo
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      KJSON: ${{ github.workspace }}/stack/kjson/bin/kjson
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: Build and install coraine - RELEASE
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make i

      #
      # The branch does not exist on the first run, so the clone fails and an empty
      # one is created. `git init -b <branch>` and not `git checkout -b`: a
      # repository with no commits has no HEAD to branch from, which is how the
      # first attempt died. No `cd` here either - it would leak into the rest of
      # the step and put the file one directory too deep.
      #
      - name: Fetch the recorded history
        run: |
          git config --global --add safe.directory '*'
          git clone --branch perf-history --single-branch --depth 50 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" history 2>/dev/null \
            || git init -q -b perf-history history
          touch history/perf.jsonl
          echo "recorded runs so far: $(wc -l < history/perf.jsonl)"

      - name: Measure
        working-directory: stack/coraine
        run: |
          for db in corDB mongoc; do
            out=$(test/perf/perfRun.sh $db)
            echo "$db: $out"
            echo "$out" > /tmp/perf-$db.json
          done

      - name: Compare with history
        id: compare
        working-directory: stack/coraine
        run: |
          status=0
          for db in corDB mongoc; do
            python3 test/perf/perfCompare.py "$GITHUB_WORKSPACE/history/perf.jsonl" "$(cat /tmp/perf-$db.json)" \
              >> "$GITHUB_STEP_SUMMARY" || status=1
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Record this run
        if: always()
        run: |
          cd history
          for db in corDB mongoc; do
            [ -f /tmp/perf-$db.json ] || continue
            python3 "$GITHUB_WORKSPACE/stack/coraine/test/perf/perfRecord.py" "$db" >> perf.jsonl
          done
          git config user.name  "coraine CI"
          git config user.email "ci@seamware.invalid"
          git add perf.jsonl
          git commit -qm "perf: ${{ github.sha }}" || exit 0
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" perf-history
        env:
          RUN_DATE: ${{ github.event.repository.updated_at }}
