#
# The pre-release campaign, in one run: everything a release is checked with before it is tagged.
#
#   nightly      nightly.yml, called: valgrind (both HTTP servers), ETSI (mhd/builtin x mongoc, mhd
#                corDB), coverage, performance, the DDS bridge image, the suite on arm64
#   packages     packages.yml, called: the Debian packages built, then installed in clean containers
#   sanitizers   the whole functional suite with every lib and the broker under AddressSanitizer +
#                UndefinedBehaviorSanitizer (and LeakSanitizer): {mhd, builtin} x {mongoc, corDB}
#   upgrade      test/upgrade/upgradeCheck.sh: the data the previous release wrote, opened by this one
#                and back again, mongoc + corDB
#   soak         hours of mixed load on one broker (test/soak/soak.py), mongoc and corDB
#   summary      every job of the run, green or red, in the run summary
#
# Run it: Actions -> Pre-release -> Run workflow, or
#
#   gh workflow run prerelease.yml -f ref=release/0.5.0 [-f soakMinutes=120] [-f only=all]
#
# Every part tests ONE commit - the sha `ref` names when the run starts, resolved once below - so a
# branch that moves during the hours this takes does not split the campaign over two commits. The
# Cor-Libs are at main (bootstrap.sh), as in the nightly. The campaign's own tools (test/sanitizer,
# test/soak, test/upgrade) come from the commit this workflow runs from, so a branch cut before a tool
# existed is checked with it. Nothing is published: no coverage site, no
# perf-history line, no apt repository. doc/testing.md, "The pre-release campaign".
#
# Job count: the free plan runs 20 jobs at a time and this run has ~45 (the nightly's 17, the
# packages' 20, eight here) - it queues, and that is accepted: it runs once per release.
#
name: Pre-release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The coraine ref to check: a branch, tag or sha (release/0.5.0)'
        required: true
        default: main
      soakMinutes:
        description: 'Minutes of soak per database'
        type: number
        default: 120
      only:
        description: 'One part only - for re-running the one that went red'
        type: choice
        default: all
        options: [all, nightly, packages, sanitizers, upgrade, soak]

#
# One run per ref and part at a time; a second one queues rather than cancelling hours of the first
#
concurrency:
  group: prerelease-${{ inputs.ref }}-${{ inputs.only }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

#
# The ROS 2 image the DDS tests run, from the Docker Hub mirror (mirror-images.yml, doc/testing.md)
#
env:
  COR_DDS_ROS2_IMAGE: quay.io/seamware/coraine-ci:mirror-vulcanexus-jazzy-desktop

jobs:
  #
  # The sha every part tests, and the release before it (the upgrade check's starting point)
  #
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha:      ${{ steps.r.outputs.sha }}
      previous: ${{ steps.r.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: r
        run: |
          sha=$(git rev-parse HEAD)
          #
          # The newest v* tag BEFORE the ref - HEAD^, so a ref that is itself tagged (v0.5.0) is
          # checked against the release before it, not against itself
          #
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "previous=${previous#v}" >> "$GITHUB_OUTPUT"
          {
            echo "### Pre-release campaign: \`${{ inputs.ref }}\` at \`${sha:0:10}\`"
            git log -1 --format="%s" | head -c 200; echo
            echo
            echo "Upgrade from: ${previous}. Soak: ${{ inputs.soakMinutes }} minutes per database."
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    needs: resolve
    if: contains(fromJSON('["all", "nightly"]'), inputs.only)
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      force: true
      only: all
      publish: false
    #
    # What the nightly's jobs ask for - a called job cannot have more than its caller grants. Nothing
    # here publishes (publish: false); the performance job's contents: write is unused.
    #
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit

  packages:
    needs: resolve
    if: contains(fromJSON('["all", "packages"]'), inputs.only)
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      libs_ref: main
      build_kind: pgo
      publish: false
    secrets: inherit

  #
  # The whole functional suite with every Cor-Lib and the broker built with
  # -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g (test/sanitizer/sanSetup.sh), on both
  # HTTP servers and both databases. A sanitizer report fails the job, as does a test that fails.
  #
  # One job per pair, not sharded: ASan costs the suite about 2x, which leaves each job far inside
  # the 6-hour ceiling, and four jobs is what the 20-job limit can spare. Shard by TIME, as ci.yml
  # does, if one ever comes near it.
  #
  # The libs are rebuilt with the sanitizers after bootstrap.sh has built them plainly: corTest's own
  # tools (corTestClient, corJson) stay unsanitized - they are linked statically, before the rebuild
  # - so a report is the broker's, and only the broker runs with the sanitizer options (the wrapper
  # COR_BROKER names). Its reports, and the UBSan lines of its stderr, go to /tmp/san-reports.
  #
  sanitizers:
    needs: resolve
    if: contains(fromJSON('["all", "sanitizers"]'), inputs.only)
    name: sanitizers ${{ matrix.httpServer }} ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        httpServer: [mhd, builtin]
        db: [mongoc, corDB]
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      #
      # A replica set, as in the nightly's valgrind jobs: ha_cache_sync.test needs a change stream
      #
      mongo:
        image: quay.io/seamware/mongo-rs:2026-09-02-c1b6cba
        ports: ['27017:27017']
      timescale:
        image: quay.io/seamware/coraine-ci:mirror-timescaledb-ha-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
      context-server:
        image: quay.io/seamware/coraine-ci:mirror-context-server-0.2.0
        env:
          MEMORY_ENABLED: 'true'
        ports: ['7080:8080']
    env:
      COR_MONGO_HOST: mongo
      COR_TROE_HOST: timescale
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      CORJSON: ${{ github.workspace }}/stack/corJson/bin/corJson
      SAN_REPORT_DIR: /tmp/san-reports
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine, ref: '${{ needs.resolve.outputs.sha }}' }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      #
      # The campaign's own tools from THIS workflow's commit, not from the ref under test: a release
      # branch cut before a tool existed is still checked with it
      #
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: |
            test/sanitizer
            test/soak
            test/upgrade
      - name: Forward localhost:7080 to the @context server
        run: socat TCP-LISTEN:7080,fork,reuseaddr TCP:context-server:8080 &

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: The sanitizer tools (gcc-san, the preload, the broker wrappers)
        run: tools/test/sanitizer/sanSetup.sh /opt/san

      #
      # CC on the make command line reaches every lib's make (MAKEFLAGS); CC in the environment is
      # what cmake reads for the broker and its plugins. libs-rebuild cleans first: the plain objects
      # bootstrap.sh left are newer than their sources.
      #
      - name: Build and install the libs and the broker under the sanitizers - ${{ matrix.httpServer }}
        working-directory: stack/coraine
        env:
          CC: /opt/san/gcc-san
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make libs-rebuild CC=/opt/san/gcc-san COR_HTTP_SERVER=${{ matrix.httpServer }}
          make di CC=/opt/san/gcc-san COR_HTTP_SERVER=${{ matrix.httpServer }}
          for f in /usr/local/bin/coraine /opt/seamware/plugins/db/currentState/corDB.so /opt/seamware/plugins/db/currentState/mongoc.so; do
            # grep -c, not -q: -q exits at the first match, nm dies of SIGPIPE, and pipefail fails the line
            nm -D "$f" | grep -c __asan_report_ > /dev/null || { echo "::error::$f is not instrumented"; exit 1; }
          done
          /opt/san/coraine --version
          rm -rf "$SAN_REPORT_DIR"

      - name: Initiate the mongo replica set
        run: stack/coraine/.github/scripts/mongo-rs-init.sh

      - name: Functional suite under the sanitizers - ${{ matrix.httpServer }} ${{ matrix.db }}
        id: suite
        working-directory: stack/coraine
        env:
          COR_BROKER: /opt/san/coraine
          COR_IMPORT: /opt/san/coraine-import
        run: ../corLibs/bin/corTest -db ${{ matrix.db }} --noColor

      - name: Sanitizer reports
        id: reports
        if: always() && steps.suite.outcome != 'skipped'
        working-directory: stack/coraine
        run: |
          set +e
          python3 "$GITHUB_WORKSPACE/tools/test/sanitizer/sanReport.py" "$SAN_REPORT_DIR" > /tmp/san-report.md
          st=$?
          { echo "### Sanitizers: ${{ matrix.httpServer }} ${{ matrix.db }} - suite ${{ steps.suite.outcome }}"; cat /tmp/san-report.md; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/san-report.md
          exit $st

      - name: The result line
        if: always()
        run: |
          mkdir -p /tmp/result
          n=$(head -1 /tmp/san-report.md 2>/dev/null | grep -oE '^\*\*[0-9]+' | tr -d '*' || true)
          echo "| sanitizers ${{ matrix.httpServer }} ${{ matrix.db }} | suite ${{ steps.suite.outcome }}, ${n:-0} distinct sanitizer finding(s) (reports: ${{ steps.reports.outcome }}) |" \
            > "/tmp/result/sanitizers-${{ matrix.httpServer }}-${{ matrix.db }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-sanitizers-${{ matrix.httpServer }}-${{ matrix.db }}
          path: /tmp/result
          retention-days: 7

      - name: Collect the reports and the failing tests' output
        if: failure()
        run: |
          mkdir -p /tmp/san-evidence
          cp -r "$SAN_REPORT_DIR" /tmp/san-evidence/reports 2>/dev/null || true
          cp /tmp/san-report.md /tmp/san-evidence/ 2>/dev/null || true
          cp stack/coraine/test/funcTests/cases/*.out stack/coraine/test/funcTests/cases/*.diff \
             stack/coraine/test/funcTests/cases/*.stderr /tmp/san-evidence/ 2>/dev/null || true
          cp /tmp/coraine*.log /tmp/corTestClient.*.log /tmp/san-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizers-${{ matrix.httpServer }}-${{ matrix.db }}
          path: /tmp/san-evidence
          retention-days: 14

  #
  # The data the previous release wrote, opened by this one: test/upgrade/upgradeCheck.sh, from the
  # previous release's image to this build, mongoc and corDB. A failed check fails the job; a
  # downgrade difference (going back is not promised) is listed in the summary.
  #
  # On the runner itself, not in a container: the old release runs as its image, and a container
  # job has no docker. The runner is set up as the arm64 nightly job's is (.github/scripts/ci-env.sh).
  #
  upgrade:
    needs: resolve
    if: contains(fromJSON('["all", "upgrade"]'), inputs.only)
    name: upgrade from ${{ needs.resolve.outputs.previous }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COR_MONGO_HOST: localhost
      COR_TROE_HOST: localhost
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      CORJSON: ${{ github.workspace }}/stack/corJson/bin/corJson
      FROM_IMAGE: quay.io/seamware/coraine:${{ needs.resolve.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine, ref: '${{ needs.resolve.outputs.sha }}' }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      #
      # The campaign's own tools from THIS workflow's commit, not from the ref under test: a release
      # branch cut before a tool existed is still checked with it
      #
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: |
            test/sanitizer
            test/soak
            test/upgrade

      - name: The build and test environment
        run: stack/coraine/.github/scripts/ci-env.sh

      - name: MongoDB and TimescaleDB, and the previous release's image
        run: |
          docker run -d --name mongo -p 27017:27017 quay.io/seamware/coraine-ci:mirror-mongo-8.0
          docker run -d --name timescale -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust quay.io/seamware/coraine-ci:mirror-timescaledb-ha-pg16
          docker pull "$FROM_IMAGE"
          for i in $(seq 1 60); do
            psql -h localhost -U postgres -c 'SELECT 1' >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "timescale never became reachable"; docker logs timescale; exit 1; }
            sleep 2
          done
          for i in $(seq 1 60); do
            mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "mongo never became reachable"; docker logs mongo; exit 1; }
            sleep 2
          done

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          make di
          coraine --version

      - name: upgradeCheck.sh ${{ needs.resolve.outputs.previous }} -> this build, mongoc + corDB
        working-directory: stack/coraine
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/tools/test/upgrade/upgradeCheck.sh" --from "$FROM_IMAGE" --to coraine --store all 2>&1 | tee /tmp/upgrade.log

      - name: Summary
        if: always()
        run: |
          mkdir -p /tmp/result
          last=$(grep -E '^upgradeCheck ' /tmp/upgrade.log | tail -1 || true)
          {
            echo "### Upgrade: ${{ needs.resolve.outputs.previous }} -> ${{ inputs.ref }}"
            echo '```'
            echo "${last:-upgradeCheck did not finish}"
            grep -E '^== |   FAIL|DOWNGRADE|   known' /tmp/upgrade.log || true
            echo '```'
            echo "<details><summary>the whole output</summary>"; echo; echo '```'; cat /tmp/upgrade.log; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "| upgrade from ${{ needs.resolve.outputs.previous }} | ${last:-did not finish} |" > /tmp/result/upgrade.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-upgrade
          path: /tmp/result
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-log
          path: /tmp/upgrade.log
          retention-days: 14

  #
  # Hours of mixed load on one broker per database, at a moderate rate - stability, not speed:
  # test/soak/soak.py. The RELEASE build, as shipped.
  #
  soak:
    needs: resolve
    if: contains(fromJSON('["all", "soak"]'), inputs.only)
    name: soak ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        db: [mongoc, corDB]
    container:
      image: quay.io/seamware/coraine-ci-nightly:2026-08-26-dd3bf56
    services:
      mongo:
        image: quay.io/seamware/coraine-ci:mirror-mongo-8.0
        ports: ['27017:27017']
    env:
      COR_MONGO_HOST: mongo
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      CORJSON: ${{ github.workspace }}/stack/corJson/bin/corJson
    steps:
      - uses: actions/checkout@v4
        with: { path: stack/coraine, ref: '${{ needs.resolve.outputs.sha }}' }
      - uses: actions/checkout@v4
        with: { repository: SEAMWARE/corLibs, path: stack/corLibs }
      #
      # The campaign's own tools from THIS workflow's commit, not from the ref under test: a release
      # branch cut before a tool existed is still checked with it
      #
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: |
            test/sanitizer
            test/soak
            test/upgrade

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: Build and install coraine - RELEASE
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make i
          coraine --version

      - name: Soak - ${{ matrix.db }}, ${{ inputs.soakMinutes }} minutes
        working-directory: stack/coraine
        run: python3 "$GITHUB_WORKSPACE/tools/test/soak/soak.py" --db ${{ matrix.db }} --minutes ${{ inputs.soakMinutes }} --work /tmp/soak

      - name: Summary
        if: always()
        run: |
          mkdir -p /tmp/result
          { echo "### Soak: ${{ matrix.db }}"; cat /tmp/soak/summary.md 2>/dev/null || echo "no summary - the soak did not finish"; } >> "$GITHUB_STEP_SUMMARY"
          fails=$(grep -c '❌' /tmp/soak/summary.md 2>/dev/null || true)
          mem=$(grep '^| memory ' /tmp/soak/summary.md 2>/dev/null | cut -d'|' -f4 || true)
          echo "| soak ${{ matrix.db }} | ${fails:-?} failed check(s);${mem:- no memory verdict} |" > "/tmp/result/soak-${{ matrix.db }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-soak-${{ matrix.db }}
          path: /tmp/result
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.db }}
          path: |
            /tmp/soak/broker.log
            /tmp/soak/rss.csv
            /tmp/soak/summary.md
          retention-days: 14

  #
  # Every job of this run, green or red - read from the API, so the nightly's and the packages' jobs
  # are listed one by one, as they ran - and the parts' own result lines
  #
  summary:
    needs: [resolve, nightly, packages, sanitizers, upgrade, soak]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: The campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --jq '.jobs[] | select(.name != "summary") | [.name, (.conclusion // .status), .started_at, .completed_at] | @tsv' > jobs.tsv
          python3 - "${{ inputs.ref }}" "${{ needs.resolve.outputs.sha }}" > summary.md <<'EOF'
          import sys, datetime, collections
          ref, sha = sys.argv[1], sys.argv[2]
          icon = {'success': '✅', 'failure': '❌', 'cancelled': '⛔', 'skipped': '⏭', 'timed_out': '⏱'}
          def minutes(a, b):
              try:
                  f = lambda s: datetime.datetime.fromisoformat(s.replace('Z', '+00:00'))
                  return f'{(f(b) - f(a)).total_seconds() / 60:.0f}'
              except Exception:
                  return ''
          parts = collections.OrderedDict()
          for line in open('jobs.tsv'):
              name, concl, start, end = (line.rstrip('\n').split('\t') + ['', '', ''])[:4]
              part = name.split(' / ')[0] if ' / ' in name else name.split(' ')[0]
              parts.setdefault(part, []).append((name, concl, minutes(start, end)))
          bad = [p for p, js in parts.items() if any(c not in ('success', 'skipped') for _, c, _ in js)]
          print(f'## Pre-release campaign: `{ref}` at `{sha[:10]}` - ' + ('✅ all green' if not bad else '❌ red: ' + ', '.join(bad)))
          print()
          print('| part | jobs | result |')
          print('|---|---|---|')
          for p, js in parts.items():
              n = collections.Counter(c for _, c, _ in js)
              print(f'| {p} | {len(js)} | ' + ' '.join(f'{icon.get(c, c)} {k}' for c, k in n.items()) + ' |')
          print()
          print('| job | result | minutes |')
          print('|---|---|---|')
          for p, js in parts.items():
              for name, c, m in js:
                  print(f'| {name} | {icon.get(c, c)} {c} | {m} |')
          EOF
          {
            cat summary.md
            if ls results/*.md > /dev/null 2>&1; then
              echo; echo '| part | result |'; echo '|---|---|'; cat results/*.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          #
          # Red if any part is: the run's own verdict is this job's
          #
          for r in "${{ needs.resolve.result }}" "${{ needs.nightly.result }}" "${{ needs.packages.result }}" \
                   "${{ needs.sanitizers.result }}" "${{ needs.upgrade.result }}" "${{ needs.soak.result }}"; do
            [ "$r" == success ] || [ "$r" == skipped ] || exit 1
          done
