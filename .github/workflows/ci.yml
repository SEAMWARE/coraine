#
# Build coraine and run the functional test suite, against both current-state
# backends.
#
# The job runs INSIDE the Cor stack's CI base image (corLibs builds and publishes
# it). Two dependencies - the mongo-c v2 driver and libmicrohttpd - are packaged by
# no distribution and have to be compiled; baking them once turns each run's setup
# into a pull.
#
# MongoDB is a SERVICE container, not something inside the image: the image is a
# build and test environment, and a database server does not belong in one. The
# harness reaches it through COR_MONGO_HOST/COR_MONGO_PORT, which is why it is
# addressed as `mongo` here and as localhost on a workstation.
#
name: CI

#
# PULL REQUESTS and manual dispatch only - never on a push.
#
# A push is not a request to test: a branch gets pushed to sync it to another
# machine, to park work, to back it up. Running the suite on every one of those is
# twenty minutes of runners spent on a question nobody asked, and it trains people
# to ignore the result. CI runs when a change is PROPOSED - or when you ask for it
# by hand from the Actions tab.
#
on:
  pull_request:
  workflow_dispatch:
  #
  # Callable, so the deploy workflow can run THIS suite against the merged tree
  # rather than keeping a second copy of it. Nothing tested main before: a pull
  # request is checked against a merge preview, and once several land, main is a
  # combination no run has ever seen.
  #
  workflow_call:

#
# Cancel superseded PULL REQUEST runs - a new commit on a branch under review makes
# the previous one moot. A manual dispatch is never cancelled: you asked for it.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

#
# A container job defaults to `sh -e {0}` - bash is in the image, GitHub just does
# not assume it. The harness and bootstrap.sh are bash.
#
defaults:
  run:
    shell: bash

jobs:
  #
  # Does this change need the suite at all? A README edit does not, and running
  # twenty minutes of tests over it teaches everyone to ignore the result.
  #
  # An ALLOW-list, not a deny-list: only changes that can affect behaviour count -
  # the sources, the tests, the build, this workflow. Anything else (doc/, *.md,
  # the backlog) skips. A manual dispatch always runs; if you asked for it, you get
  # it.
  #
  # Gated as a JOB rather than with paths-ignore, deliberately: a workflow skipped
  # by paths-ignore reports NO status, which a required check reads as "still
  # waiting". A skipped job reports success.
  #
  relevant:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #
      # GitHub does not complain about a workflow it cannot parse - it just stops
      # running it. The nightly sat broken and silent for a day that way, after an
      # env var was spliced into the middle of a `steps:` list. So: parse them all,
      # every time, and fail loudly here instead.
      #
      - name: The workflow files must parse
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::not valid YAML - GitHub would silently ignore this workflow"; exit 1; }
            echo "  ok  $f"
          done

      - id: check
        run: |
          #
          # Anything that is not a pull request runs the lot. The path filter below
          # needs `github.base_ref` to diff against, and only a pull request has
          # one - so on a manual dispatch, or a call from the deploy workflow, there
          # is nothing to compare with and nothing to be clever about. A merge to
          # main should run the whole suite regardless: it is the tree that is about
          # to be published.
          #
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "${{ github.event_name }} - running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "changed files:"; echo "$changed"

          #
          # test/funcTests/ - NOT test/. The suite this job runs lives there;
          # test/perf/ and test/etsi/ are the nightly's, and running the
          # functional suite because a performance script changed proves
          # nothing about the script and costs four jobs.
          #
          if echo "$changed" | grep -qE '^(src/|test/funcTests/|test/CMakeLists\.txt|CMakeLists\.txt|makefile|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No source, test or build changes - skipping the functional suite"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: relevant
    if: needs.relevant.outputs.run == 'true'
    runs-on: ubuntu-latest

    #
    # Four jobs, named for what they run - `functest mongoc 1-324` and so on, the
    # same convention as the nightly's valgrind shards and as Orion-LD's
    # functional_0_501. A red square says which half of which backend went red
    # without opening it.
    #
    # It was ONE job running both suites back to back: 21.3 minutes of mongoc then
    # 10.7 of corDB, 33.5 with the setup. They are independent measurements and had
    # no reason to be sequential.
    #
    # The cuts are measured, from run 32471125462, and by TIME rather than by count
    # because the suites are back-loaded: splitting mongoc down the middle by count
    # gives 9.8 and 11.1 minutes, and a stage ends when its slowest job does.
    #
    # corDB is cut at its OWN index. It runs 563 tests where mongoc runs 612 - a
    # test that pins a backend-specific answer declares REQUIRE_DB and belongs to
    # one of them only - and corTest filters before it numbers, so index 314 is a
    # different test in each. The two ranges are not comparable and are not meant
    # to be.
    #
    # Neither second shard has an upper bound (corTest reads --toIx 0 as "to the
    # end"). Hardcode the last index and the day somebody adds a test it is run by
    # nobody, silently.
    #
    name: functest ${{ matrix.shard.db }} ${{ matrix.shard.name }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { db: mongoc, name: '1-324',   from: 1,   to: 324 }
          - { db: mongoc, name: '325-end', from: 325, to: 0 }
          - { db: corDB,  name: '1-314',   from: 1,   to: 314 }
          - { db: corDB,  name: '315-end', from: 315, to: 0 }

    #
    # The base image is PUBLIC, so the job needs no registry credential at all -
    # only the workflow that publishes it does. That is the difference between a
    # pipeline that can be broken by someone else's secret and one that cannot.
    #
    #
    # PINNED, and there is no "latest" to follow even if you wanted to. An image
    # that changes under a build turns a red run into a mystery: same commit,
    # different result, no diff to explain it. Adopting a new one is a one-line
    # change here - reviewable, and bisectable, because the run that first used it
    # is a commit. corLibs prints the tag to paste when it publishes.
    #
    container:
      image: quay.io/coraine/ci:2026-08-21-a81a418

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017

      #
      # The 46 temporal tests exercise a plugin we ship, so they run here rather
      # than being quietly excluded. TimescaleDB is postgres plus an extension;
      # the harness creates and drops its own databases per role.
      #
      #
      # The -ha variant, because the timescale plugin's migration does
      # CREATE EXTENSION postgis and declares a geography column - the plain
      # timescaledb image has neither, and every broker start dies on it.
      #
      timescale:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432

      #
      # The @context server the context tests push to and then reference by URL.
      # On a workstation the harness starts it with docker; there is no docker in
      # a container job, so it is a service here.
      #
      context-server:
        image: wistefan/context-server:0.2.0
        env:
          MEMORY_ENABLED: 'true'
        ports:
          - 7080:8080

    env:
      COR_MONGO_HOST: mongo
      COR_TROE_HOST: timescale
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      #
      # corCurl sorts JSON bodies with this tool, and every expect was captured
      # sorted - without it the bodies arrive in insertion order and every
      # JSON-bearing test fails on member order alone. bootstrap.sh builds it as
      # part of the k-libs; it is simply not on PATH here.
      #
      KJSON: ${{ github.workspace }}/stack/kjson/bin/kjson

    steps:
      #
      # The build contract is that the repos are SIBLINGS - every CMakeLists and
      # every include path resolves ../<name>. So coraine is checked out into a
      # subdirectory of a common parent, and bootstrap.sh puts the rest beside it.
      #
      - name: Check out coraine
        uses: actions/checkout@v4
        with:
          path: stack/coraine

      - name: Check out corLibs
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE/corLibs
          path: stack/corLibs

      - name: Clone and build the dependency stack
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      - name: Build and install coraine
        id: build
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di

      - name: Wait for the databases
        run: |
          for i in $(seq 1 30); do
            mongosh --host mongo --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "mongo never became reachable"; exit 1; }
            sleep 2
          done
          for i in $(seq 1 30); do
            psql -h timescale -U postgres -c 'SELECT 1' >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "timescale never became reachable"; exit 1; }
            sleep 2
          done
          echo "both databases are up"

      #
      # 36 tests hardcode http://localhost:7080/jsonldContexts/... and assert that
      # URL back in Link headers, so pointing them at the service by name is not
      # an option - localhost:7080 has to work INSIDE this container. socat makes
      # it work, and the tests stay identical here and on a workstation.
      #
      - name: Forward localhost:7080 to the @context server
        run: |
          socat TCP-LISTEN:7080,fork,reuseaddr TCP:context-server:8080 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://localhost:7080/jsonldContexts/_probe && break
            sleep 1
          done
          curl -s -o /dev/null -w 'context server answers: %{http_code}\n' http://localhost:7080/jsonldContexts/_probe

      #
      # Ten seconds that save an hour: if the broker cannot start, every one of the
      # 1175 tests fails identically with "port 1026 not ready" and the run says
      # nothing about why. This says why.
      #
      - name: Smoke test - does the broker start
        run: |
          set -x
          which coraine && coraine --version
          ls -l /opt/seamware/plugins/db/currentState/ /opt/seamware/plugins/troe/temporal/
          coraine --port 1026 --database corDB --troe none --apiPlugins admin \
                  > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:1026/ngsi-ld/v1/types >/dev/null && break
            sleep 1
          done
          echo "--- broker log:"; cat /tmp/smoke.log
          curl -sf http://localhost:1026/admin/version || { echo "BROKER DID NOT START"; exit 1; }
          pkill -x coraine || true

      #
      # One step now, parameterised. The two backends used to be two steps in one
      # job, with the second guarded so a red mongoc run could not hide a red corDB
      # one; they are separate JOBS now, so that guard is what `fail-fast: false`
      # says instead - and it covers all four rather than just the pair.
      #
      - name: Functional tests - ${{ matrix.shard.db }} ${{ matrix.shard.name }}
        working-directory: stack/coraine
        run: |
          to=""
          [ "${{ matrix.shard.to }}" != "0" ] && to="--toIx ${{ matrix.shard.to }}"
          ../corLibs/bin/corTest -db ${{ matrix.shard.db }} --noColor \
              --fromIx ${{ matrix.shard.from }} $to

      - name: Keep the output of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ matrix.shard.db }}-${{ matrix.shard.name }}
          path: |
            stack/coraine/test/funcTests/cases/*.out
            stack/coraine/test/funcTests/cases/*.diff
            stack/coraine/test/funcTests/cases/*.log
            /tmp/coraine*.log
            /tmp/smoke.log
          retention-days: 7
