version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # A broken cross-reference is a build failure, not a warning nobody reads.
  # Without this, mkdocs emits a warning, Read the Docs publishes anyway, and the
  # dead link is live on the site - which is how ../README.md and ../ToDo.md,
  # neither of which exists under docs_dir, survived unnoticed.
  fail_on_warning: true

python:
  install:
    - requirements: doc/requirements.txt
