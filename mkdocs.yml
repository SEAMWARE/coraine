site_name: coraine
site_url: https://coraine.readthedocs.io
repo_url: https://github.com/SEAMWARE/coraine
site_description: coraine - a lightweight NGSI-LD Context Broker in C
docs_dir: doc
site_dir: html
markdown_extensions: [toc, fenced_code, tables, admonition, footnotes]
use_directory_urls: false
theme: readthedocs
extra_css: ["https://fiware.org/style/fiware_readthedocs.css"]
#
# bridge-channels.md is EXCLUDED from the build, not merely left out of the nav.
#
# Leaving a page out of `nav` does not unpublish it: mkdocs builds every .md
# under docs_dir regardless, so it was live and reachable by URL with no
# sidebar and no context around it. `exclude_docs` is what keeps it off the site.
#
# It is the design of a concept going to the ETSI TC DATA face-to-face in Athens,
# 20-22 October 2026; Bridges and Channels is not standard NGSI-LD.
#
# Proposals to ETSI themselves - their drafts, decks and the discussion around
# them - are NOT in this public repository: they are in the private SEAMWARE/etsi
# (proposals/drafts/). Problem Details and error reporting moved there on
# 2026-10-05.
#
exclude_docs: |
  bridge-channels.md
  bridge-channels-details.md
  history/bridge-channels.md
  tutorial-doubts.md

nav:
  - Home: index.md
  - Installation & Administration: installation.md
  - High Availability: high-availability.md
  - Performance and footprint: performance.md
  - API walkthrough: api-walkthrough.md
  - Plugin architecture: plugin-architecture.md
  - Building from source: building.md
  - Testing: testing.md
  - DDS and ROS 2: dds.md
  - Speaking to devices directly: device-protocols.md
  - The Modbus bridge: modbus-bridge.md
  - The MQTT bridge: mqtt-bridge.md
  - The cor format and cor://: cor-protocol.md
  - WebSocket: websocket.md
  - Coroutines: coroutines.md
  - Authorization in the broker: authorization.md
  - FIWARE IoT Agents: iot-agents.md
  - Test coverage: coverage.md
  - Functest coverage of the spec: spec-coverage-gaps.md
  - Roadmap: roadmap.md
  - Ideas: ideas.md
  - FIWARE GE checklist: fiware-ge-checklist.md
  - History:
      - Building: history/building.md
      - cor://: history/cor-protocol.md
      - Coroutines: history/coroutines.md
      - Test coverage: history/coverage.md
      - The Modbus bridge: history/modbus-bridge.md
      - Performance: history/performance.md
      - Plugin architecture: history/plugin-architecture.md
      - Testing: history/testing.md
