site_name: coraine
site_url: https://coraine.readthedocs.io
repo_url: https://github.com/SEAMWARE/coraine
site_description: coraine - a lightweight NGSI-LD Context Broker in C
docs_dir: doc
site_dir: html
markdown_extensions: [toc, fenced_code, tables, admonition, footnotes]
use_directory_urls: false
theme: readthedocs
extra_css: ["https://fiware.org/style/fiware_readthedocs.css"]
#
# bridge-channels.md, problem-details.md and error-reporting.md are EXCLUDED from
# the build, not merely left out of the nav.
#
# Leaving a page out of `nav` does not unpublish it: mkdocs builds every .md
# under docs_dir regardless, so both were live and reachable by URL with no
# sidebar and no context around them - which is the worst way for a reader to
# arrive at an unimplemented proposal. `exclude_docs` is what actually keeps
# them off the site.
#
# They are working design notes for the two concepts going to the ETSI TC DATA
# face-to-face in Athens, 20-22 October 2026. Neither is implemented, and
# Bridges and Channels is not standard NGSI-LD. The material goes to Athens as
# slide decks; until then it is not something to publish beside the user
# documentation.
#
# ⚠️ This governs the DOCUMENTATION SITE only. Both files are still in this
# public repository and visible on GitHub. If they should not be public at all,
# they have to leave the repository - and git history keeps them either way.
#
# They stay in doc/ for now because the reasoning in them is what stops a
# settled decision from being re-argued. Implementation is the trigger for
# publishing either.
#
exclude_docs: |
  bridge-channels.md
  problem-details.md
  error-reporting.md
  tutorial-doubts.md

nav:
  - Home: index.md
  - Installation & Administration: installation.md
  - Performance and footprint: performance.md
  - API walkthrough: api-walkthrough.md
  - Plugin architecture: plugin-architecture.md
  - Building from source: building.md
  - Testing: testing.md
  - Speaking to devices directly: device-protocols.md
  - FIWARE IoT Agents: iot-agents.md
  - Test coverage: coverage.md
  - Functest coverage of the spec: spec-coverage-gaps.md
  - Roadmap: roadmap.md
  - FIWARE GE checklist: fiware-ge-checklist.md
