# coraine + MongoDB — the default backend, ready to run.
#
#   docker compose -f docker/docker-compose.yml up
#   curl localhost:1026/ngsi-ld/v1/types
#
# For a broker with no external services at all, skip compose entirely:
#   docker run --rm -p 1026:1026 <image> --database corDB
#
# Copyright 2026 Seamware

services:
  mongo:
    image: mongo:8
    # No port published: only the broker needs to reach it. Add
    # "ports: [27017:27017]" if you want to inspect the data from the host.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  broker:
    # Published image; swap for coraine:local to use a locally built one.
    # No `latest` is ever published - the deploy pushes ONE immutable tag per
    # merge, `<version>-<date>-<sha>`. Name the one you want:
    #   CORAINE_TAG=0.3.0-2026-08-21-abc1234 docker compose up
    image: quay.io/seamware/coraine:${CORAINE_TAG:?set CORAINE_TAG to a published tag}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "1026:1026"
    # ENTRYPOINT already supplies "coraine -fg"; this replaces the default CMD.
    # --dbHost defaults to localhost, which inside a container is the container
    # itself — it has to point at the mongo service by name.
    command:
      - --database
      - mongoc
      - --dbHost
      - mongo
      - --dbName
      - cor
      - --troe
      - none
      - --apiPlugins
      - admin

volumes:
  mongo-data:
