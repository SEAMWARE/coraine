# SPDX-License-Identifier: Apache-2.0
#
# The Data Space Connector's provider side, as its charts deploy it (data-space-connector 10.10.3:
# decentralized-iam 2.1.27 = vc-authentication 1.4.0 + odrl-authorization 2.4.3), for footprint.sh - each
# component in its own container, the images and versions the charts pin, the settings their READMEs give:
#
#   data service   Scorpio java-4.1.10 (the chart's "resource friendly all-in-one-runner without kafka") on PostGIS
#   authorization  APISIX 3.17.0 (openid-connect + odrl-authorization's opa plugin), OPA 1.11.0, odrl-pap 1.7.1
#   authentication VCVerifier 6.23.1, Trusted Issuers List 0.9.1, Credentials Config Service 3.4.2
#   databases      PostgreSQL 16 for odrl-pap, the TIL and the CCS (the chart: one postgres-operator cluster)
#
# Bridge network; only Scorpio (9090), APISIX (9080) and the PAP (8080) are published, on localhost.
#
services:
  scorpio-db:
    image: postgis/postgis:16-3.4
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ngb", "-d", "ngb"]
      interval: 1s
      retries: 60
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb

  scorpio:
    image: scorpiobroker/all-in-one-runner:java-4.1.10
    depends_on: { scorpio-db: { condition: service_healthy } }
    restart: on-failure
    environment:
      DBHOST: scorpio-db
    ports: ["127.0.0.1:9090:9090"]

  iam-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./iam-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ccs"]
      interval: 1s
      retries: 60

  pap:
    image: quay.io/fiware/odrl-pap:1.7.1
    depends_on: { iam-db: { condition: service_healthy } }
    restart: on-failure
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://iam-db:5432/pap
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: "8080"
      GENERAL_ORGANIZATION_DID: did:web:provider
    ports: ["127.0.0.1:8080:8080"]

  opa:
    image: openpolicyagent/opa:1.11.0
    command: ["run", "--server", "-c", "/config/opa.yaml", "--addr", "0.0.0.0:8181"]
    volumes:
      - ./opa.yaml:/config/opa.yaml:ro

  apisix:
    image: apache/apisix:3.17.0-debian
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix-routes.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ${FP_WORK}/plugins:/opts/custom_plugins/apisix/plugins:ro
    ports: ["127.0.0.1:9080:9080"]

  vcverifier:
    image: quay.io/fiware/vcverifier:6.23.1
    environment:
      CONFIG_FILE: /config/server.yaml
    volumes:
      - ./vcverifier.yaml:/config/server.yaml:ro

  til:
    image: quay.io/fiware/trusted-issuers-list:0.9.1
    depends_on: { iam-db: { condition: service_healthy } }
    restart: on-failure
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://iam-db:5432/til
      DATASOURCES_DEFAULT_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: postgres
      DATASOURCES_DEFAULT_DIALECT: POSTGRES

  ccs:
    image: quay.io/fiware/credentials-config-service:3.4.2
    depends_on: { iam-db: { condition: service_healthy } }
    restart: on-failure
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://iam-db:5432/ccs
      DATASOURCES_DEFAULT_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: postgres
      DATASOURCES_DEFAULT_DIALECT: POSTGRES
