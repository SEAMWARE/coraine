# SPDX-License-Identifier: Apache-2.0
#
# A gateway in front of the broker, for gatewayCompare.sh: the Data Space Connector's provider-side chain as
# test/fdscDiff deploys it (APISIX 3.17.0 with openid-connect and odrl-authorization 2.4.3's opa plugin, OPA
# 1.11.0 polling the ODRL-PAP's bundles, odrl-pap 1.7.1 on PostgreSQL), pinned for a throughput measure:
# APISIX one nginx worker on GW_APISIX_CPU, OPA one Go thread (GOMAXPROCS=1) on GW_OPA_CPU. The broker runs on
# the host (perfRun.sh) on 127.0.0.1:1027; host networking throughout. GW_APISIX_CONFIG: APISIX's config.yaml
# (default apisix-config.yaml: openid-connect, opa); the plugin ngsild-pep's library, keys and policies in
# GW_WORK, mounted at /opts/ngsild.
#
services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    command: ["postgres", "-p", "5440"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pap

  pap:
    image: quay.io/fiware/odrl-pap:1.7.1
    network_mode: host
    depends_on: [postgres]
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5440/pap
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_MANAGEMENT_PORT: "9001"
      GENERAL_ORGANIZATION_DID: did:web:provider

  opa:
    image: openpolicyagent/opa:1.11.0
    network_mode: host
    cpuset: "${GW_OPA_CPU:-2}"
    environment:
      GOMAXPROCS: "1"
    command: ["run", "--server", "-c", "/config/opa.yaml", "--addr", "127.0.0.1:8181"]
    volumes:
      - ./opa.yaml:/config/opa.yaml:ro

  apisix:
    image: apache/apisix:3.17.0-debian
    network_mode: host
    cpuset: "${GW_APISIX_CPU:-1}"
    volumes:
      - ${GW_APISIX_CONFIG:-./apisix-config.yaml}:/usr/local/apisix/conf/config.yaml:ro
      - ${GW_ROUTES}:/usr/local/apisix/conf/apisix.yaml:ro
      - ${GW_WORK}/plugins:/opts/custom_plugins/apisix/plugins:ro
      - ${GW_WORK}:/opts/ngsild:ro
