# APISIX standalone (odrl-authorization 2.4.3 values.yaml: data_plane, config_provider yaml) with the chart's
# custom opa plugin, which takes the place of APISIX's own (the same name, earlier on the lua path)
apisix:
  node_listen: 9080
  extra_lua_path: "/opts/custom_plugins/?.lua"
  enable_admin: false
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
plugins:
  - openid-connect
  - opa
